<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>mitreden — piper-in-the-browser spike</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg">
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto;
         padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  p.lede { color: #666; }
  fieldset { border: 1px solid #ccc; border-radius: .4rem; margin: 1rem 0; padding: .8rem 1rem; }
  legend { font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
  textarea { width: 100%; font: inherit; padding: .5rem; box-sizing: border-box; }
  select, button { font: inherit; padding: .4rem .6rem; }
  button { cursor: pointer; }
  button[disabled] { cursor: default; opacity: .5; }
  label.radio { display: block; margin: .2rem 0; }
  #log { font: 13px/1.45 ui-monospace, monospace; white-space: pre-wrap;
         background: #0001; padding: .8rem; border-radius: .4rem; min-height: 6rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #0002; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  audio { width: 100%; margin-top: .6rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
</style>
<main>

<h1>piper in the browser — spike</h1>
<p class="lede">Does the whole mitreden pipeline run in a tab, with nothing behind
it? Type a sentence, pick a voice, pick a post-processing path, get an MP3.
Everything below happens on this device; nothing is uploaded.</p>

<fieldset>
  <legend>Sentence</legend>
  <textarea id="text" rows="2">Ich möchte noch nicht ins Bett.</textarea>
  <div class="row" style="margin-top:.6rem">
    <select id="voice">
      <option value="de_DE-kerstin-low">Kerstin · de · low (~20 MB)</option>
      <option value="de_DE-thorsten-medium">Thorsten · de · medium (~63 MB)</option>
      <option value="en_US-kristin-medium">Kristin · en · medium (~63 MB)</option>
    </select>
    <button id="go">Record</button>
    <button id="compare" title="Run both post-processing paths on the same recording and measure the result">Compare both</button>
    <button id="clear" title="Delete cached voice models from this browser">Clear cache</button>
  </div>
</fieldset>

<fieldset>
  <legend>Trim &amp; normalise</legend>
  <label class="radio"><input type="radio" name="dsp" value="js" checked>
    <b>JS</b> — hand-written silence trim + BS.1770 loudness, lamejs for MP3
    (~250 KB of library)</label>
  <label class="radio"><input type="radio" name="dsp" value="ffmpeg">
    <b>ffmpeg.wasm</b> — the exact filter string from
    <code>mitreden.py:96</code> (~32 MB core, ~10 MB over the wire).
    <b>Do not ship this:</b> the newest core is built from ffmpeg 5.1.4, whose
    loudnorm gets the gain wrong on about half of all short sentences — around
    13.6 dB too quiet. See <code>README.md</code> next to this file.</label>
  <label class="radio"><input type="radio" name="dsp" value="none">
    <b>none</b> — raw piper WAV, for comparison</label>
</fieldset>

<fieldset>
  <legend>Result</legend>
  <div id="out">Nothing recorded yet.</div>
</fieldset>

<fieldset>
  <legend>Log</legend>
  <div id="log"></div>
  <p style="font-size:.85rem;color:#666">
    <span id="env"></span>
  </p>
</fieldset>

</main>

<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js"
  }
}
</script>
<script type="module">
// vits-web ships a bundle that still imports onnxruntime-web by bare name, so
// it needs a bundler — or, here, an import map. 1.18.0 on purpose: vits-web
// loads its wasm binaries from that exact version, and a mismatched pair fails
// deep inside the runtime with nothing useful to read.
import * as tts from 'https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/dist/vits-web.js';

// The same filter chain the container runs — see mitreden.py:96. Kept as one
// string on purpose: if the two ever have to match, they match here.
const FILTERS =
  'silenceremove=start_periods=1:start_silence=0.05:start_threshold=-50dB,' +
  'areverse,' +
  'silenceremove=start_periods=1:start_silence=0.05:start_threshold=-50dB,' +
  'areverse,' +
  'loudnorm=I=-16:TP=-1.5:LRA=11';

const OUT_RATE = 44100, OUT_BITRATE = 192, TARGET_LUFS = -16, TARGET_PEAK_DB = -1.5;

const $ = s => document.querySelector(s);
const logEl = $('#log');
let t0;
const log = m => { logEl.textContent += m + '\n'; };
const mark = label => { const t = performance.now();
  log(`  ${label.padEnd(28)} ${(t - t0).toFixed(0).padStart(6)} ms`); t0 = t; };

$('#env').textContent =
  `${navigator.hardwareConcurrency || '?'} cores · ` +
  (navigator.deviceMemory ? navigator.deviceMemory + ' GB RAM · ' : '') +
  (crossOriginIsolated ? 'cross-origin isolated' : 'not isolated (single-thread only)') +
  ` · ${navigator.userAgent}`;

// ---------------------------------------------------------------- piper

async function synth(text, voiceId) {
  let last = -1;
  const wav = await tts.predict({ text, voiceId }, p => {
    const pct = Math.round(p.loaded * 100 / p.total);
    if (pct >= last + 20) { log(`  downloading ${p.url.split('/').pop()} … ${pct}%`); last = pct; }
  });
  return wav;  // Blob, audio/wav
}

// ------------------------------------------------------- post: ffmpeg.wasm

let ffmpeg = null;
async function loadFFmpeg() {
  if (ffmpeg) return ffmpeg;
  const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js');
  const { toBlobURL } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
  const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
  const lib = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm';
  const f = new FFmpeg();
  f.on('log', ({ message }) => {
    if (!message.trim()) return;
    if (ffLines) ffLines.push(message);            // a measurement is running
    else log('  ffmpeg: ' + message);
  });
  // Everything comes in as a same-origin blob URL. The wasm cannot be
  // instantiated across origins, and ffmpeg.wasm's own worker cannot be
  // constructed from one either — classWorkerURL is the documented way out.
  // Self-hosted on Pages all three are same-origin and this goes away.
  // ffmpeg.wasm's own worker is a module worker with two relative imports.
  // Turned into a blob those no longer resolve, so they are made absolute
  // first. Self-hosted, this whole dance is one plain path.
  const workerSrc = (await (await fetch(`${lib}/worker.js`)).text())
    .replace(/from *"\.\/([^"]+)"/g, `from "${lib}/$1"`);
  await f.load({
    classWorkerURL: URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })),
    coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpeg = f;
  return f;
}

async function postFFmpeg(wavBlob) {
  const f = await loadFFmpeg();
  mark('ffmpeg core ready');
  await f.writeFile('in.wav', new Uint8Array(await wavBlob.arrayBuffer()));
  await f.exec(['-y', '-loglevel', 'error', '-i', 'in.wav', '-af', FILTERS,
                '-ar', String(OUT_RATE), '-ac', '1', '-b:a', `${OUT_BITRATE}k`, 'out.mp3']);
  const data = await f.readFile('out.mp3');
  await f.deleteFile('in.wav'); await f.deleteFile('out.mp3');
  return new Blob([data], { type: 'audio/mpeg' });
}

// ----------------------------------------------------------- post: plain JS

async function resample(buf, rate) {
  const len = Math.ceil(buf.duration * rate);
  const ctx = new OfflineAudioContext(1, len, rate);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination); src.start();
  return ctx.startRendering();
}

// silenceremove, both ends: find the first and last sample above -50 dB and
// keep 50 ms of the quiet either side, so the word does not start abruptly.
function trim(x, rate, thresholdDb = -50, padSec = 0.05) {
  const th = Math.pow(10, thresholdDb / 20), pad = Math.round(padSec * rate);
  let a = 0, b = x.length - 1;
  while (a < x.length && Math.abs(x[a]) < th) a++;
  while (b > a && Math.abs(x[b]) < th) b--;
  if (a >= b) return x;                       // all silence — leave it alone
  return x.subarray(Math.max(0, a - pad), Math.min(x.length, b + pad + 1));
}

// ITU-R BS.1770-4 integrated loudness. Coefficients are the 48 kHz ones, so
// the signal has to be at 48 kHz when this runs.
function biquad(x, b0, b1, b2, a1, a2) {
  const y = new Float32Array(x.length);
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
  }
  return y;
}

function integratedLufs(x, rate) {
  let k = biquad(x, 1.53512485958697, -2.69169618940638, 1.19839281085285,
                    -1.69065929318241, 0.73248077421585);       // head shelf
  k = biquad(k, 1.0, -2.0, 1.0, -1.99004745483398, 0.99007225036621); // RLB
  const block = Math.round(0.4 * rate), step = Math.round(0.1 * rate);
  const z = [];
  for (let s = 0; s + block <= k.length; s += step) {
    let sum = 0;
    for (let i = s; i < s + block; i++) sum += k[i] * k[i];
    z.push(sum / block);
  }
  if (!z.length) return -Infinity;
  const L = v => -0.691 + 10 * Math.log10(v || 1e-12);
  const above = t => z.filter(v => L(v) > t);
  let g = above(-70);                                    // absolute gate
  if (!g.length) return -Infinity;
  const relative = L(g.reduce((a, b) => a + b, 0) / g.length) - 10;
  g = g.filter(v => L(v) > relative);                    // relative gate
  if (!g.length) return -Infinity;
  return L(g.reduce((a, b) => a + b, 0) / g.length);
}

function encodeMp3(samples, rate) {
  const enc = new lamejs.Mp3Encoder(1, rate, OUT_BITRATE);
  const pcm = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    const v = Math.max(-1, Math.min(1, samples[i]));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const parts = [];
  for (let i = 0; i < pcm.length; i += 1152) {
    const b = enc.encodeBuffer(pcm.subarray(i, i + 1152));
    if (b.length) parts.push(new Uint8Array(b));
  }
  const end = enc.flush();
  if (end.length) parts.push(new Uint8Array(end));
  return new Blob(parts, { type: 'audio/mpeg' });
}

let lamejs = null;
async function postJS(wavBlob) {
  if (!lamejs) lamejs = await import('https://cdn.jsdelivr.net/npm/@breezystack/lamejs@1.2.7/dist/lamejs.js');
  const ctx = new AudioContext();
  const decoded = await ctx.decodeAudioData(await wavBlob.arrayBuffer());
  log(`  piper output: ${decoded.duration.toFixed(2)} s`);
  await ctx.close();
  mark('decode');

  const at48 = await resample(decoded, 48000);           // measure at 48 kHz
  const cut = trim(at48.getChannelData(0), 48000);
  mark(`trim (${((at48.length - cut.length) / 48000).toFixed(2)} s removed)`);

  const lufs = integratedLufs(cut, 48000);
  let gain = Math.pow(10, (TARGET_LUFS - lufs) / 20);
  let peak = 0;
  for (let i = 0; i < cut.length; i++) peak = Math.max(peak, Math.abs(cut[i]));
  const ceiling = Math.pow(10, TARGET_PEAK_DB / 20);
  if (peak * gain > ceiling) gain = ceiling / peak;       // clamp, do not clip
  const levelled = new Float32Array(cut.length);
  for (let i = 0; i < cut.length; i++) levelled[i] = cut[i] * gain;
  mark(`loudness (${lufs.toFixed(1)} LUFS → ${TARGET_LUFS}, ${(20 * Math.log10(gain)).toFixed(1)} dB)`);

  const tmp = new AudioContext({ sampleRate: 48000 });
  const buf = tmp.createBuffer(1, levelled.length, 48000);
  buf.copyToChannel(levelled, 0);
  await tmp.close();
  const final = await resample(buf, OUT_RATE);
  mark('resample to 44.1 kHz');

  const mp3 = encodeMp3(final.getChannelData(0), OUT_RATE);
  mark('mp3 encode');
  return mp3;
}

// ------------------------------------------------------------ cross-check

let ffLines = null;

// What does ffmpeg think of a finished file? loudnorm in measurement mode
// prints the integrated loudness and true peak it found, which is the only
// impartial answer to "do the two paths agree".
async function measure(blob) {
  const f = await loadFFmpeg();
  await f.writeFile('m.mp3', new Uint8Array(await blob.arrayBuffer()));
  ffLines = [];
  try {
    // -loglevel info explicitly: av_log's level is global to the wasm
    // instance, and the render pass above already turned it down to error.
    await f.exec(['-y', '-loglevel', 'info', '-i', 'm.mp3', '-af',
                  'loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json',
                  '-f', 'null', '-']);
    const json = ffLines.join('\n').match(/\{[\s\S]*?\}/);
    if (!json) { log('  no loudnorm json in ' + ffLines.length + ' lines: '
                     + ffLines.slice(-6).join(' | ')); return null; }
    const m = JSON.parse(json[0]);
    return { lufs: parseFloat(m.input_i), peak: parseFloat(m.input_tp) };
  } finally {
    ffLines = null;
    await f.deleteFile('m.mp3');
  }
}

$('#compare').addEventListener('click', async () => {
  const text = $('#text').value.trim();
  if (!text) return;
  const voiceId = $('#voice').value;
  $('#compare').disabled = $('#go').disabled = true;
  logEl.textContent = `${voiceId} \u00b7 both paths, same recording\n`;
  t0 = performance.now();
  try {
    const wav = await synth(text, voiceId);
    mark('piper (once, shared)');
    const a = await postJS(wav);
    const b = await postFFmpeg(wav);
    const [ma, mb] = [await measure(a), await measure(b)];
    const row = (name, blob, m) =>
      `<tr><td>${name}</td><td class="n">${(blob.size / 1024).toFixed(1)} KB</td>` +
      `<td class="n">${m ? m.lufs.toFixed(1) : '?'} LUFS</td>` +
      `<td class="n">${m ? m.peak.toFixed(1) : '?'} dBTP</td></tr>`;
    $('#out').innerHTML =
      '<table><tr><th>path</th><th>size</th><th>loudness</th><th>true peak</th></tr>' +
      row('JS', a, ma) + row('ffmpeg.wasm', b, mb) + '</table>';
    if (ma && mb) log(`  ${'difference'.padEnd(28)} ${(ma.lufs - mb.lufs).toFixed(2)} LU`);
    for (const [name, blob] of [['js', a], ['ffmpeg', b]]) {
      $('#out').append(Object.assign(document.createElement('audio'),
        { controls: true, src: URL.createObjectURL(blob), title: name }));
    }
  } catch (e) {
    log('  FAILED: ' + (e && e.message ? e.message : String(e)));
    console.error(e);
  } finally {
    $('#compare').disabled = $('#go').disabled = false;
  }
});

// ------------------------------------------------------------------- wiring

$('#go').addEventListener('click', async () => {
  const text = $('#text').value.trim();
  if (!text) return;
  const voiceId = $('#voice').value;
  const dsp = document.querySelector('input[name=dsp]:checked').value;
  $('#go').disabled = true;
  logEl.textContent = '';
  log(`${voiceId} · ${dsp}`);
  const started = performance.now();
  t0 = started;
  try {
    const cached = await tts.stored();
    log(cached.includes(voiceId) ? '  model already on this device'
                                 : '  model not cached — downloading');
    const wav = await synth(text, voiceId);
    mark('piper (incl. any download)');

    let blob = wav, ext = 'wav';
    if (dsp === 'ffmpeg') { blob = await postFFmpeg(wav); ext = 'mp3'; }
    else if (dsp === 'js') { blob = await postJS(wav); ext = 'mp3'; }

    log(`  ${'total'.padEnd(28)} ${(performance.now() - started).toFixed(0).padStart(6)} ms`);
    log(`  ${'size'.padEnd(28)} ${(blob.size / 1024).toFixed(1).padStart(6)} KB`);

    const url = URL.createObjectURL(blob);
    const id = text.toLowerCase().replace(/[^a-z0-9äöüß]+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
    $('#out').innerHTML = '';
    const audio = Object.assign(document.createElement('audio'), { controls: true, src: url });
    const a = Object.assign(document.createElement('a'),
      { href: url, download: `${id}.${ext}`, textContent: `Download ${id}.${ext}` });
    $('#out').append(audio, a);
  } catch (e) {
    log('  FAILED: ' + (e && e.message ? e.message : String(e)));
    console.error(e);
  } finally {
    $('#go').disabled = false;
  }
});

// Exposed so the batch harness in spike/README.md can drive the same code
// paths the buttons use, rather than a second copy that could drift.
window.spike = { synth, postJS, postFFmpeg, measure, loadFFmpeg };

$('#clear').addEventListener('click', async () => {
  await tts.flush();
  log('voice cache cleared');
});
</script>
