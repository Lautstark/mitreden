:root{

  --shadow-sm:0 1px 2px rgba(28,26,23,.05);
  --shadow:0 2px 6px rgba(28,26,23,.06),0 12px 32px rgba(28,26,23,.08);
  --radius:14px; --radius-sm:9px; --radius-pill:999px; --radius-item:7px;
  --sidebar-w:268px;
  --accent-soft:#ffeef6;
  --ok:#1a7f42; --warn:#8a5a00; --miss:#787168;
  --danger:#b3261e; --danger-soft:#fdeceb;
}

    --accent:#ff8bc7; --accent-ink:#14161c;
    --accent-strong:#ff8bc7;       /* on this ground the accent already reads */
    --accent-hover:#ffa3d2;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
    --accent-soft:#2a1b25;
    --ok:#3fb96b; --warn:#f0a202; --miss:#7c8496;

.workhead{display:flex;align-items:center;gap:14px;margin:26px 0 10px}
/* The name is the control. Renaming a Sammlung is typing in its title, which

.title-input{flex:1;min-width:0;margin:0;padding:2px 6px;border:1px solid transparent;

  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.menu button{font:inherit;font-size:14px;font-weight:500;text-align:left;
  white-space:nowrap;background:transparent;border:0;border-radius:7px;
  padding:9px 11px;color:var(--text);cursor:pointer}
.menu button:hover{background:var(--surface-3)}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-soft)}
.empty{color:var(--text-faint);padding:40px 20px;font-size:15px;text-align:center}
.more{width:100%;margin-top:18px;color:var(--text-dim);font-size:14px}
/* On a phone the player is wider than the room left over, and it used to push
   the delete button off the screen. Give it a line of its own instead. */
/* Below this the player and the text fight over the same room, long before
   the layout actually breaks — so the player moves to its own line early. */
@media (max-width:820px){
  /* The Sammlung's name gets the width it needs; what you can do with it goes
     underneath, rather than three controls fighting over one line. */
  .workhead{flex-wrap:wrap;gap:8px 10px;margin:20px 0 10px}
  .title-input{flex:1 0 100%;font-size:22px}
  /* The count reads as a sentence, so it gets its own line; the two controls
     stay side by side underneath rather than one of them wrapping alone. */
  .workhead .count{margin-left:0;order:3;flex:1 0 100%}
  .workhead .split{order:4}
  .workhead .menuwrap{order:5;margin-left:0}
  /* The picker was pinned right and cut its own label off. */
  .chint .right{margin-left:0;flex:1 0 100%}
  .asbutton{width:100%;max-width:none}
  .compose{padding:14px 14px 14px 16px}
  .compose textarea{font-size:19px}
}
@media (max-width:720px){
  .item{flex-wrap:wrap;gap:10px}
  .item .txt{order:2}          /* keeps flex:1;min-width:0 so it can shrink */
  .menuwrap{order:3}
  .item audio{order:4;flex:1 1 100%;width:100%}
}
@media (max-width:560px){
  .hero{padding:16px 16px 12px}
  textarea{font-size:17px;min-height:112px}
  .item .line{font-size:17px}
  .bar{gap:8px}
  .tools{gap:8px}
  /* Three controls in one row leaves the search box a stub — it gets its own
     line, the format and the button share the next one. */
  .tools input[type=search]{flex:1 1 100%;min-width:0}
  .tools button{flex:1}
}

<!-- Narrow screens get a bar instead of a rail: the rail slides over the work
     rather than squeezing it, and the scrim closes it. mitreden is sold as
     usable from a phone, so this is not decoration. -->
<div class="topbar">
  <button id="railopen" class="icon" data-i18n-aria="collections_show">☰</button>

<div id="scrim" class="scrim" hidden></div>

<aside id="rail" class="rail">
  <div class="rail__brand">
    <h1><img class="logo" src="icon.svg" alt="" width="34" height="34">mitreden</h1>
    <button id="railclose" class="icon" data-i18n-aria="collections_hide">✕</button>
  </div>

  <div class="rail__part">
    <input id="q" type="search" data-i18n-ph="search_hint" autocomplete="off">

    <button id="newcol" class="quiet small" data-i18n="collection_new"></button>

</aside>

<main>

<dialog id="setup" class="sheet">
  <div class="sheet__head">
    <h2 data-i18n="settings"></h2>
    <button id="setupclose" class="icon" data-i18n-aria="close">✕</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="voices" data-i18n="tab_voices"></button>
    <button class="tab" data-tab="language" data-i18n="tab_language"></button>
    <button class="tab" data-tab="data" data-i18n="tab_data"></button>
  </div>

  <section class="pane" data-pane="voices">
    <div id="cloud"></div>
  </section>

  <section class="pane" data-pane="language" hidden>
    <div class="card">
      <select id="lang" class="langpick" aria-label="Sprache / Language"></select>
    </div>
  </section>

  <section class="pane" data-pane="data" hidden>
    <div class="card">
      <p class="sub"><b data-i18n="backup_title"></b> <span data-i18n="backup_intro"></span></p>
    </div>
    <div class="row">
      <button class="primary" id="export" data-i18n="backup_export"></button>
      <button id="import" data-i18n="backup_import"></button>
    </div>
    <p class="hint" data-i18n="backup_hint"></p>
    <input type="file" id="importfile" accept="application/json,.json" hidden>

    <h3 class="danger__title" data-i18n="danger_title"></h3>
    <p class="sub" data-i18n="danger_body"></p>
    <button class="linkdanger" id="wipe" data-i18n="danger_do"></button>
  </section>
</dialog>

  <div class="compose">
    <textarea id="t" data-i18n-ph="new_phrases_hint"></textarea>
    <button class="send" id="add" data-i18n-aria="add_phrase"
      data-i18n-title="add_phrase">→</button>
  </div>
  <p class="chint">
    <span><kbd>Enter</kbd> <span id="chint1"></span> ·
      <kbd>Shift</kbd> + <kbd>Enter</kbd> <span id="chint2"></span></span>
    <span class="right"><select id="voice" class="asbutton"
      data-i18n-aria="voice_label" data-i18n-title="voice_title"></select></span>
  </p>
  <p class="status" id="s" hidden></p>
