<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>mitreden</title>
    <meta name="description" content="Sätze werden zu Audiodateien, damit jedes Gerät mit derselben Stimme spricht." />
    <!-- Empty on purpose: initTheme() fills it from the resolved --bg, so it is
         right in either scheme and stays right when the accent moves. mitreden
         had no theme-color at all, which left the address bar the browser's own
         grey above a page that is neither. -->
    <meta name="theme-color" />
    <!-- Before the stylesheet, and inline rather than in the bundle: a module is
         deferred, so a scheme read there lands after the first paint and the page
         flashes the OS's answer before correcting itself. bootSnippet() from
         @lautstark/design/theme, copied in because there is nothing earlier than
         this to import it from. It touches one attribute and nothing else. -->
    <script>
      try{var t=localStorage.getItem("mitreden.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
    </script>
    <!-- The one rule that has to be here rather than in the stylesheet, because
         it is about this element and this element only exists here. The page is
         src/ui/App.svelte and it is mounted into this; `display: contents` is
         what lets the topbar, the scrim, the sidebar and the work column go on
         being the body's own flex children, which is where the layout in
         src/styles/app.css puts them. -->
    <style>#app{display:contents}</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
