<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>mitreden</title>
    <meta name="description" content="Sätze werden zu Audiodateien, damit jedes Gerät mit derselben Stimme spricht." />
  </head>
  <body>
    <!-- Narrow screens get a bar instead of a rail: the rail slides over the work
         rather than squeezing it, and the scrim closes it. mitreden is sold as
         usable from a phone, so this is not decoration. -->
    <div class="topbar">
      <button id="railopen" class="icon" data-i18n-aria="collections_show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1><img class="logo" src="icon.svg" alt="" width="28" height="28">mitreden</h1>
    </div>
    <div id="scrim" class="scrim" hidden></div>

    <!-- What brings the rail back once it is put away. It floats over the work in
         the corner the rail vacated, which is where bildhaft puts it and where
         the eye is already looking for it. -->
    <div class="reveal" id="reveal" hidden>
      <button id="railshow" class="icon" data-i18n-aria="collections_show"
        data-i18n-title="collections_show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <img class="reveal__logo" src="icon.svg" alt="" width="22" height="22">
    </div>

    <aside id="rail" class="rail">
      <div class="rail__brand">
        <h1><img class="logo" src="icon.svg" alt="" width="34" height="34">mitreden</h1>
        <!-- Two controls, because they answer two different questions: on a phone
             the rail is a layer over the work and ✕ dismisses it; on a desktop it
             is a column of the page and this puts the column away for good. -->
        <button id="railhide" class="icon" data-i18n-aria="collections_hide"
          data-i18n-title="collections_hide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button id="railclose" class="icon" data-i18n-aria="collections_hide">✕</button>
      </div>

      <div class="rail__part">
        <input id="q" class="field" type="search" data-i18n-ph="search_hint" autocomplete="off">
      </div>

      <div class="rail__part rail__grow">
        <h2 data-i18n="filter_collections"></h2>
        <div class="list" id="rows"></div>
        <button id="newcol" class="btn quiet sm" data-i18n="collection_new"></button>
      </div>

      <div class="rail__foot">
        <button id="gear" class="flat" data-i18n="settings"></button>
        <button id="import2" class="flat" data-i18n="import_label"></button>
      </div>
    </aside>

    <main>

    <dialog id="info" class="sheet">
    <div class="head">
      <h2 id="infotitle"></h2>
      <button id="infoclose" class="icon" data-i18n-aria="close">✕</button>
    </div>
    <div id="infobody"></div>
  </dialog>

  <dialog id="setup" class="sheet">
      <div class="head">
        <h2 data-i18n="settings"></h2>
        <button id="setupclose" class="icon" data-i18n-aria="close">✕</button>
      </div>

      <!-- Five panels, not three tabs. A tab hides two thirds of the settings
           behind a choice you have to make before you can look; a panel says
           what it holds in its own heading — which voice, whether Azure has a
           key, how many sentences there are — so a look is enough and opening
           is a decision. components.css's .panel, native <details>, so the
           browser owns the folding and the keyboard. -->
      <details class="panel" id="p-voice" open>
        <summary>
          <span class="section" data-i18n="voice_pick_title"></span>
          <span class="state" id="voicestate"></span>
        </summary>
        <div class="body">
          <input id="voiceq" class="field" type="search" data-i18n-ph="voice_search_hint" autocomplete="off">
          <div class="chips" id="voicefilters"></div>
          <div class="voices" id="voices"></div>
        </div>
      </details>

      <details class="panel" id="p-azure">
        <summary>
          <span class="section">Azure Speech</span>
          <span class="state" id="azurestate"></span>
        </summary>
        <div class="body" id="cloud"></div>
      </details>

      <details class="panel" id="p-lang">
        <summary>
          <span class="section" data-i18n="panel_language"></span>
          <span class="state" id="langstate"></span>
        </summary>
        <div class="body">
          <!-- The last native select in the program. It drew its own chevron from
               a hex baked into a data URI, which cannot read a token — so it was
               the one control that could not follow the theme. It is the same
               button and the same menu as everything else now. -->
          <span class="menu-anchor start"><button id="lang" class="btn quiet sm dropdown"
            aria-haspopup="true" aria-expanded="false"
            aria-label="Sprache / Language"></button></span>
          <p class="hint" data-i18n="language_hint"></p>
        </div>
      </details>

      <details class="panel" id="p-data">
        <summary>
          <span class="section" data-i18n="backup_title"></span>
          <span class="state" id="datastate"></span>
        </summary>
        <div class="body">
          <p class="hint" data-i18n="backup_intro"></p>
          <div class="row">
            <button class="btn primary" id="export" data-i18n="backup_export"></button>
          </div>
          <p class="hint" data-i18n="backup_hint"></p>
          <input type="file" id="importfile" accept="application/json,.json" hidden>
        </div>
      </details>

      <!-- No state line, and not by omission: this section offers an action and
           has nothing to report about itself. An empty .state says "there is a
           report here and it is blank", which is the one thing a heading that
           carries its status must not say. -->
      <details class="panel" id="p-wipe">
        <summary>
          <span class="section" data-i18n="danger_title"></span>
        </summary>
        <div class="body">
          <p class="hint" data-i18n="danger_body"></p>
          <button class="linkdanger" id="wipe" data-i18n="danger_do"></button>
        </div>
      </details>
    </dialog>

      <div class="compose">
        <textarea id="t" data-i18n-ph="new_phrases_hint"></textarea>
        <button class="send" id="add" data-i18n-aria="add_phrase"
          data-i18n-title="add_phrase">→</button>
      </div>
      <p class="chint">
        <span><kbd>Enter</kbd> <span id="chint1" data-i18n="compose_records"></span> ·
          <kbd>Shift</kbd> + <kbd>Enter</kbd> <span id="chint2" data-i18n="compose_newline"></span></span>
        <!-- Not a control: a statement of which voice the next recording gets,
             and a way through to where that is changed. -->
        <span class="right voicenow">
          <span class="voicenow__what" data-i18n="voice_label"></span>
          <b id="voicename"></b>
          <span class="voicenow__from" id="voicefrom"></span>
          <button id="voicepick" class="btn quiet sm" data-i18n="voice_change"></button>
        </span>
      </p>
      <p class="status" id="s" hidden></p>


    <!-- The Sammlung you are in: its name, how much is in it, and what you can do
         with the whole of it. bildhaft's row, with Herunterladen where Drucken is —
         the same question, answered in audio instead of paper. -->
    <div class="workhead">
      <input id="colname" class="title-input" data-i18n-ph="collection_name_hint"
        data-i18n-aria="collection_name_hint" autocomplete="off">
      <span class="count" id="count"></span>
      <!-- bildhaft's Drucken is one button because printing asks nothing further.
           This one has to ask which format, so it keeps the button's shape and
           opens the same menu the ⋯ opens. It was a native select, whose written
           case was that the browser draws the open list and so nothing is left
           to get wrong per theme — true, and beside the point: what the browser
           draws belongs to no design language, and it sat next to a ⋯ that does. -->
      <span class="menu-anchor"><button id="dlall" class="btn quiet sm dropdown"
        aria-haspopup="true" aria-expanded="false" data-i18n="download_all"></button></span>
      <span class="menu-anchor"><button id="colmore" class="icon" aria-haspopup="true"
        aria-expanded="false" data-i18n-title="more_actions"
        data-i18n-aria="more_actions">⋯</button></span>
    </div>

    <div id="list"></div>

    <!-- The page is the whole program now, so it has to say what it is and what
         it does with what you type. Both are one line; neither belongs in a
         dialog nobody opens. -->
    <!-- Three dialogs, not pages: bildhaft's shape. The one-line privacy
         summary is gone from here on purpose — a footer has no room to say
         what does leave, and a claim without its exception reads as broader
         than it is. The about dialog has the room. -->
    <footer class="footer">
      <button class="linklike" id="about" data-i18n="about_link"></button>
      <button class="linklike" id="impressum">Impressum</button>
      <button class="linklike" id="datenschutz">Datenschutz</button>
    </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
