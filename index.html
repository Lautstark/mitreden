<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>mitreden</title>
    <meta name="description" content="Sätze werden zu Audiodateien, damit jedes Gerät mit derselben Stimme spricht." />
    <!-- Empty on purpose: main.ts fills it from the resolved --bg, so it is right
         in either scheme and stays right when the accent moves. mitreden had no
         theme-color at all, which left the address bar the browser's own grey
         above a page that is neither. -->
    <meta name="theme-color" />
    <!-- Before the stylesheet, and inline rather than in the bundle: a module is
         deferred, so a scheme read there lands after the first paint and the page
         flashes the OS's answer before correcting itself. bootSnippet() from
         @lautstark/design/theme, copied in because there is nothing earlier than
         this to import it from. It touches one attribute and nothing else. -->
    <script>
      try{var t=localStorage.getItem("mitreden.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
    </script>
  </head>
  <body>
    <!-- Narrow screens get a bar instead of a rail: the rail slides over the work
         rather than squeezing it, and the scrim closes it. mitreden is sold as
         usable from a phone, so this is not decoration. -->
    <div class="topbar">
      <button id="railopen" class="btn quiet icon" data-i18n-aria="collections_show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1><img class="logo" src="icon.svg" alt="" width="28" height="28">mitreden</h1>
    </div>
    <div id="scrim" class="scrim" hidden></div>

    <!-- What brings the rail back once it is put away. It floats over the work in
         the corner the rail vacated, which is where bildhaft puts it and where
         the eye is already looking for it. -->
    <div class="reveal" id="reveal" hidden>
      <button id="railshow" class="btn quiet icon" data-i18n-aria="collections_show"
        data-i18n-title="collections_show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <img class="reveal__logo" src="icon.svg" alt="" width="22" height="22">
    </div>

    <aside id="rail" class="rail">
      <div class="rail__brand">
        <h1><img class="logo" src="icon.svg" alt="" width="34" height="34">mitreden</h1>
        <!-- Two controls, because they answer two different questions: on a phone
             the rail is a layer over the work and ✕ dismisses it; on a desktop it
             is a column of the page and this puts the column away for good. -->
        <button id="railhide" class="btn quiet icon" data-i18n-aria="collections_hide"
          data-i18n-title="collections_hide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button id="railclose" class="btn quiet icon" data-i18n-aria="collections_hide">✕</button>
      </div>

      <div class="rail__part">
        <input id="q" class="field" type="search" data-i18n-ph="search_hint" autocomplete="off">
      </div>

      <div class="rail__part rail__grow">
        <h2 data-i18n="filter_collections"></h2>
        <div class="collections" id="rows"></div>
        <button id="newcol" class="btn quiet sm" data-i18n="collection_new"></button>
      </div>

      <div class="rail__foot">
        <button id="gear" class="flat" data-i18n="settings"></button>
      </div>
    </aside>

    <main>

    <dialog id="info" class="sheet">
    <div class="head">
      <h2 id="infotitle"></h2>
      <button id="infoclose" class="btn quiet icon" data-i18n-aria="close">✕</button>
    </div>
    <div id="infobody"></div>
  </dialog>

  <dialog id="setup" class="sheet">
      <div class="head">
        <h2 data-i18n="settings"></h2>
        <button id="setupclose" class="btn quiet icon" data-i18n-aria="close">✕</button>
      </div>

      <!-- Five panels, not three tabs. A tab hides two thirds of the settings
           behind a choice you have to make before you can look; a panel says
           what it holds in its own heading — which voice, whether Azure has a
           key, how many sentences there are — so a look is enough and opening
           is a decision. components.css's .panel, native <details>, so the
           browser owns the folding and the keyboard.

           name="settings" makes the five one exclusive group - opening one
           closes the rest - which is the platform's own accordion and behaves
           like a radio group. Without it the sheet becomes a scroll through
           everything anybody has ever opened, and the state in each heading,
           which is the whole reason they are folded, stops being readable at a
           glance. @lautstark/design conventions.md §3.5. -->
      <!-- First, and open on arrival. Somebody who cannot read this page needs
           this panel before any of the others, and the two options below name
           themselves - „Deutsch" and „English" are the same words whichever
           language the rest of the sheet is in. vorlaut put it here first and
           said why; the reasoning is not vorlaut's, it is the page's.

           It is also why nothing else opens on arrival: one panel open is a
           choice about which one somebody most needs, and this is the only one
           where not reading the page is the case being answered. -->
      <details class="panel" name="settings" id="p-lang" open>
        <summary>
          <span class="section" data-i18n="panel_language"></span>
          <span class="state" id="langstate"></span>
        </summary>
        <div class="body">
          <!-- The same segmented control as the scheme below it, and that
               pairing is the point: two facts about this page, offered the same
               way. It was a native select first — it drew its own chevron from a
               hex baked into a data URI, which cannot read a token, so it was
               the one control that could not follow the theme — and then a
               button and a menu, which put the choice behind a press. A menu is
               for a list of things to do; this is a list of what the page is.
               The accessible name is bilingual and fixed, because somebody who
               cannot read the page is exactly who reaches for this. -->
          <div class="segmented" id="lang" role="group"
            aria-label="Sprache / Language"></div>
          <p class="hint" data-i18n="language_hint"></p>
        </div>
      </details>

      <!-- The default a new Sammlung starts with, and not the voice the next
           sentence gets — which is what this panel used to say and what it
           stopped being when the voice moved onto the Sammlung. What one
           particular Sammlung records in is behind the ⋯ beside its name;
           conventions.md §3.10 is the test that put it there, and the hint
           below is how somebody standing in front of this list finds it. -->
      <details class="panel" name="settings" id="p-voice">
        <summary>
          <span class="section" data-i18n="panel_voice_default"></span>
          <span class="state" id="voicestate"></span>
        </summary>
        <div class="body">
          <p class="hint" data-i18n="voice_default_hint"></p>
          <input id="voiceq" class="field" type="search" data-i18n-ph="voice_search_hint" autocomplete="off">
          <div class="chips" id="voicefilters"></div>
          <div class="voices" id="voices"></div>
        </div>
      </details>

      <details class="panel" name="settings" id="p-azure">
        <summary>
          <span class="section">Azure Speech</span>
          <span class="state" id="azurestate"></span>
        </summary>
        <div class="body" id="cloud"></div>
      </details>


      <!-- Beside the language, because both are what this page is rather than
           what is in it. The three answers are one control: "follows the OS" is
           an answer too, and the default one — a two-state switch has to open in
           light or dark and so has to guess, which is how a tablet that dims
           itself at dusk ends up pinned bright. -->
      <details class="panel" name="settings" id="p-theme">
        <summary>
          <span class="section" data-i18n="panel_theme"></span>
          <span class="state" id="themestate"></span>
        </summary>
        <div class="body">
          <!-- role=group, not radiogroup: components.css marks the choice with
               aria-pressed, which is what bildhaft's print dialog already uses,
               and a radiogroup whose children are not radios reads worse than a
               labelled group of buttons. -->
          <div class="segmented" id="theme" role="group" data-i18n-aria="panel_theme"></div>
          <p class="hint" data-i18n="theme_hint"></p>
        </div>
      </details>

      <!-- One panel, as bildhaft's Daten is: a backup and a reset are the same
           subject — what happens to everything you have — and reading about the
           one is how you find the other. The reset keeps its own heading inside,
           because a destructive action still has to announce itself. -->
      <details class="panel" name="settings" id="p-data">
        <summary>
          <span class="section" data-i18n="panel_data"></span>
          <span class="state" id="datastate"></span>
        </summary>
        <div class="body">
          <!-- bildhaft's shape, element for element: the warning as a notice with
               a word in front of it, then the backup, then the reset under a
               heading of its own. Two elements rather than one line of markup,
               so the lead is a translated string like every other and nothing
               here sets innerHTML from the language files. -->
          <p class="notice"><b data-i18n="backup_lead"></b> <span data-i18n="backup_intro"></span></p>

          <!-- The folder first, because it is the one that keeps working after
               somebody stops thinking about it. Hidden outright where the
               browser has no picker - Safari, Firefox, anything on Android -
               so the download below is then the whole offer, unchanged.
               The two ids are painted from ui/backupFolder.ts and carry no
               data-i18n of their own: their text is rebuilt through t() on
               every status change, which is also every language change. -->
          <div id="folderbox" class="folderbox">
            <p class="hint" data-i18n="folder_lead"></p>
            <p class="standing" id="folderstate"></p>
            <div class="row" id="folderactions"></div>
          </div>

          <!-- The two halves of the same subject, side by side. „Sicherung
               einlesen" used to be „Importieren" in the rail, a screen away
               from the button that makes the file it reads - history rather
               than intent, since that button predates there being a backup
               format and quietly gained a second job when one arrived. It
               still does both: importFile routes on the file's own shape. -->
          <div class="row">
            <button class="btn primary sm" id="export" data-i18n="backup_export"></button>
            <button class="btn sm" id="import2" data-i18n="backup_import"></button>
          </div>
          <p class="hint" data-i18n="backup_hint"></p>
          <input type="file" id="importfile" accept="application/json,.json" hidden>

          <h3 class="danger__title" data-i18n="danger_title"></h3>
          <p class="hint danger__body" data-i18n="danger_body"></p>
          <button class="btn destructive sm" id="wipe" data-i18n="danger_do"></button>
        </div>
      </details>
    </dialog>

    <!-- One Sammlung's own voice. A sheet rather than a column of folded panels
         (§3.5) because there is exactly one thing here to set: mitreden's
         Sammlung holds a voice and nothing else, where vorlaut's talker holds a
         voice and a device language and so earns the column. A single folded
         panel would be a heading you have to open to reach the only thing
         behind it.

         Live apply, no Save and no Cancel: a voice destroys nothing. The clips
         stay; they stop matching what the Sammlung says it sounds like, which
         is what the line under the list says and what „neu aufnehmen" in the
         same ⋯ undoes. -->
    <dialog id="colvoice" class="sheet">
      <div class="head">
        <h2 id="colvoicetitle"></h2>
        <button id="colvoiceclose" class="btn quiet icon" data-i18n-aria="close">✕</button>
      </div>
      <div class="body">
        <p class="hint" id="colvoicelead"></p>
        <input id="colvoiceq" class="field" type="search" data-i18n-ph="voice_search_hint" autocomplete="off">
        <div class="chips" id="colvoicefilters"></div>
        <div class="voices" id="colvoices"></div>
        <p class="hint" id="colvoicecost"></p>
      </div>
    </dialog>

      <div class="compose">
        <textarea id="t" data-i18n-ph="new_phrases_hint"></textarea>
        <button class="send" id="add" data-i18n-aria="add_phrase"
          data-i18n-title="add_phrase">→</button>
      </div>
      <p class="chint">
        <span><kbd>Enter</kbd> <span id="chint1" data-i18n="compose_records"></span> ·
          <kbd>Shift</kbd> + <kbd>Enter</kbd> <span id="chint2" data-i18n="compose_newline"></span></span>
        <!-- Not a control: a statement of which voice the next recording gets,
             and only that.

             It carried an „Ändern" button until 2026-08-29, and the comment
             here argued that one button leading to two different places was
             honest because the caption said which. That argument was the tell.
             The two doors are now where they belong - a Sammlung's voice is in
             its own ⋯ menu, the default is in Einstellungen - and this line
             does not route anywhere, so there is nothing left to keep in step
             with it.

             Written from composer.ts rather than carried by data-i18n, because
             what it says depends on where the next sentence lands: this
             Sammlung's voice, or the default an uncollected sentence records
             in. -->
        <span class="right voicenow">
          <span class="voicenow__what" id="voicewhat"></span>
          <b id="voicename"></b>
          <span class="voicenow__from" id="voicefrom"></span>
        </span>
      </p>
      <!-- role="status" is aria-live="polite", and the element is never hidden
           and never removed: a live region has to be in the accessibility tree
           already when the text lands, or the reader has nothing to notice a
           change in. That is why this is not toggled with [hidden] any more —
           empty, it is a block with no content, so it takes no room either. -->
      <p class="status" id="s" role="status"></p>


    <!-- The Sammlung you are in: its name, how much is in it, and what you can do
         with the whole of it. bildhaft's row, with Herunterladen where Drucken is —
         the same question, answered in audio instead of paper. -->
    <div class="workhead">
      <input id="colname" class="title-input" data-i18n-ph="collection_name_hint"
        data-i18n-aria="collection_name_hint" autocomplete="off">
      <span class="count" id="count"></span>
      <!-- bildhaft's Drucken is one button because printing asks nothing further.
           This one has to ask which format, so it keeps the button's shape and
           opens the same menu the ⋯ opens. It was a native select, whose written
           case was that the browser draws the open list and so nothing is left
           to get wrong per theme — true, and beside the point: what the browser
           draws belongs to no design language, and it sat next to a ⋯ that does. -->
      <span class="menu-anchor"><button id="dlall" class="btn quiet sm dropdown"
        aria-haspopup="menu" aria-expanded="false" data-i18n="download_all"></button></span>
      <span class="menu-anchor"><button id="colmore" class="btn quiet icon" aria-haspopup="menu"
        aria-expanded="false" data-i18n-title="more_actions"
        data-i18n-aria="more_actions">⋯</button></span>
    </div>

    <div id="list"></div>

    <!-- The page is the whole program now, so it has to say what it is and what
         it does with what you type. Both are one line; neither belongs in a
         dialog nobody opens. -->
    <!-- Three dialogs, not pages: bildhaft's shape. The one-line privacy
         summary is gone from here on purpose — a footer has no room to say
         what does leave, and a claim without its exception reads as broader
         than it is. The about dialog has the room. -->
    <footer class="footer">
      <button class="linklike" id="about" data-i18n="about_link"></button>
      <button class="linklike" id="impressum">Impressum</button>
      <button class="linklike" id="datenschutz">Datenschutz</button>
    </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
