services:
  mitreden:
    build: .
    image: mitreden
    container_name: mitreden
    ports:
      # Anderer Port am Rechner, falls dort schon etwas läuft:
      #   MITREDEN_PORT=8798 docker compose up -d
      - "${MITREDEN_PORT:-8770}:8770"
    volumes:
      # Das ganze Projekt hineinreichen: so liegen phrases.json, config.json
      # und out/ auf dem NAS und überleben jedes Neubauen des Abbilds. Der
      # Azure-Schlüssel kommt über die .env aus genau diesem Ordner — mitreden
      # liest sie beim Start selbst. Er steckt bewusst nicht im Abbild.
      - ./:/app
    # Auf einer Synology läuft der Container sonst als root, und alles, was er
    # anlegt (out/, phrases.json), gehört danach root — über die Netzfreigabe
    # lässt es sich dann nicht mehr bearbeiten. Eigene Kennung per SSH mit
    # "id" herausfinden und hier eintragen, z.B. "1026:100".
    # user: "1026:100"
    restart: unless-stopped
