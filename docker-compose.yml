services:
  mitreden:
    # The NAS pulls this instead of building it — the CI builds amd64 and
    # arm64 on every push. To build locally instead: docker compose up --build
    image: ghcr.io/steffipetaffy/mitreden:latest
    build: .
    container_name: mitreden
    ports:
      # Another port on the host, in case something already runs there:
      #   MITREDEN_PORT=8798 docker compose up -d
      - "${MITREDEN_PORT:-8770}:8770"
    volumes:
      # This folder holds your data, not the program: phrases.json, config.json,
      # out/ and the .env with the key. It lives on the NAS, survives every new
      # image, and is what you back up. The code stays inside the image — do
      # not mount over /app, that would hide it.
      - ./:/data
    # On a Synology the container otherwise runs as root, and everything it
    # creates (out/, phrases.json) belongs to root afterwards — over the
    # network share you can no longer edit it. Find your own id over SSH with
    # "id" and put it here, e.g. "1026:100".
    # user: "1026:100"
    restart: unless-stopped
