name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'renovate/**']
    # renovate/**, since 2026-09-16: Renovate merges a branch to main itself
    # once this run is green on it, and never a branch that has no run.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing reaches Pages unless this passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The install really is what package.json pins
        # Before any suite, on its own, and it fails rather than warns. A stale
        # node_modules surfaces as a test failing elsewhere with plausible
        # numbers in it - see tools/installcheck.mjs. Distinct from the pins.js
        # step below, which asks the opposite question of the same packages:
        # this one asks whether the install matches the pin, that one whether
        # the pin has fallen behind what upstream has published.
        run: npm run preflight

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      - name: Whether the shared drawings are reaching the page
        # pins.js above asks whether this product has the right version of
        # @lautstark/design. This asks the question underneath it: whether it
        # is using it. A product stylesheet loads after components.css, so a
        # bare rule of the same name wins and the shared drawing never reaches
        # the page - and it looks exactly like it worked, because the product
        # goes on rendering the way it always did.
        #
        # --strict: this repository reports none, and that is the state worth
        # keeping. A bare rule of a shared name either goes, gets an ancestor
        # so it aims at one place instead of replacing the drawing, or says
        # why in a `shadows .name:` comment beside it. The tool does not judge
        # the reason; it asks that there be one.
        run: node node_modules/@lautstark/design/shadows.js --strict

      - name: Typecheck and build
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test
        env:
          # The recording test fetches a 60 MB voice from Hugging Face. That is
          # the one request the product itself makes, so CI makes it too rather
          # than mocking the only thing that can genuinely break.
          CI: 'true'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: test
    # Pull requests are tested but never published.
    # By ref, not by event: a renovate/** push is tested above and must not
    # reach Pages. Only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Served from a subdomain of lautstark.tech, so the bundle sits at the
        # root rather than under /<repo>/. The CNAME file in the published
        # output is what holds that domain across deploys.
        env:
          BASE_PATH: /
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # By ref, not by event: a renovate/** push is tested above and must not
    # reach Pages. Only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
