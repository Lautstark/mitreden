name: Container image

on:
  push:
    branches: [main]
    paths:
      # Everything the image carries. The program is not one file: it reads
      # ui.html, the language files and the icon from beside itself, so a
      # change to any of them is a change to what the image serves. The page
      # used to live inside mitreden.py, which is why it was the only entry
      # here — editing it now would otherwise ship nothing.
      - Dockerfile
      - mitreden.py
      - ui.html
      - icon.svg
      - lang/**
      - .github/workflows/docker.yml
  # So the image can be rebuilt without inventing a commit — after a base
  # image gets a security update, or to see whether the cache is doing
  # anything.
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Written out rather than worked out from ${{ github.repository }},
      # which is where it used to come from. The repository is moving to
      # another owner, and the image name would have followed it on its own:
      # the workflow would have begun publishing under a new path while both
      # READMEs, docker-compose.yml and the three launchers in docs/ went on
      # naming the old one. Nothing would have reported it — whoever already
      # runs this would simply have kept pulling a tag that had stopped
      # moving.
      #
      # Lowercase throughout because Docker tags have to be and usernames do
      # not.
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/steffipetaffy/mitreden" >> "$GITHUB_ENV"

      # Built for this runner only and loaded into its Docker, so that it can
      # actually be started. The multi-arch build below reuses these layers,
      # so this costs the push almost nothing.
      - name: Build it once for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mitreden:smoke
          # Everything expensive in the Dockerfile — apt, pip install piper,
          # and four voice models pulled off HuggingFace — sits above
          # `COPY . .`, so an ordinary commit changes only the last layer and
          # the rest can come out of the cache instead of off the network.
          #
          # Its own scope, apart from the multi-arch build below. Both write
          # with mode=max, and two builds with different platform sets writing
          # the same scope overwrite each other's index — after which neither
          # of them hits.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64,ignore-error=true

      # A build that succeeds only means the image exists. It says nothing
      # about whether the program inside it still finds the files it reads
      # from beside itself — ui.html, lang/, icon.svg. Leave one of them out
      # and the image builds perfectly, then fails the moment somebody opens
      # the page. So: start it, and ask it for the page.
      #
      # Before the push on purpose. A broken image that was already tagged
      # :latest is one somebody's NAS may have pulled by the time anyone
      # notices.
      - name: It runs, and it serves the page
        run: |
          set -euo pipefail
          trap 'echo "--- container log ---"; docker logs smoke || true' ERR

          docker run -d --name smoke -p 8770:8770 mitreden:smoke
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8770/ >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8770/ -o page.html
          head -c 15 page.html | grep -q '<!doctype html>'
          grep -q '</html>' page.html
          echo "  the page is served whole ($(wc -c < page.html) bytes)"

          for path in /api/phrases /api/voices /api/strings /icon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8770$path")
            echo "  $path -> $code"
            test "$code" = "200"
          done

          # The whole chain inside the image: a voice, ffmpeg, a file.
          docker exec smoke python mitreden.py add "Aus dem Container."
          docker rm -f smoke

      # amd64 and arm64, so NAS models on ARM can pull the image instead of
      # building it themselves.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          # arm64 is built under emulation and is most of the time this job
          # takes, so it is the leg that gains the most from not repeating
          # the downloads. Reads the amd64 scope as well: that half was just
          # built for the smoke test and does not need doing twice.
          #
          # ignore-error, because a cache that cannot be written is a slow
          # build, not a broken release — and this step is the release.
          cache-from: |
            type=gha,scope=multi
            type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=multi,ignore-error=true
